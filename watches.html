/* ---------------------------------------------------------
   GALLERY — masonry-style grid
   - a fine grid-auto-rows unit lets each tile's row-span be
     set to match its real image height (JS below measures it)
   - grid-auto-flow: dense backfills any gaps left by bigger tiles
   - .tile.big spans 2 columns for the occasional larger image
---------------------------------------------------------- */
.gallery {
  display: grid;
  grid-template-columns: repeat(3, 1fr); /* same 3 columns as before */
  grid-auto-rows: 8px;      /* fine unit — smaller = more precise heights */
  grid-auto-flow: dense;    /* fills gaps left by spanned tiles */
  gap: 10px;
  padding: 10px;
  max-width: 2500px;
  margin: 0 auto;
}

.tile {
  overflow: hidden;
  border-radius: 0;
}

.tile.big {
  grid-column: span 2;   /* occasional wider tile */
}

.gallery img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;   /* crops to fill the tile's computed cell size */
  transition: transform 0.3s ease, opacity 0.3s ease;
}

}

<script>
  // ----------------------------------------------------------------
  // Masonry sizing script
  // Which tiles are "big" is now set by hand in the HTML (class="tile big")
  // — this script just measures each image's real rendered height and
  // converts that into a grid-row span, so every tile's row height
  // matches its actual image. That's what removes the gaps.
  // Re-runs on window resize since column width (and therefore each
  // image's rendered height) changes at different screen sizes.
  // ----------------------------------------------------------------
  const gallery = document.getElementById('gallery');
  const tiles = Array.from(gallery.querySelectorAll('.tile'));

  function resizeGridItem(tile) {
    const rowHeight = 8;   // must match grid-auto-rows in CSS
    const rowGap = 10;     // must match gap in CSS
    const img = tile.querySelector('img');
    if (!img || !img.naturalHeight) return;
    const contentHeight = tile.getBoundingClientRect().width * (img.naturalHeight / img.naturalWidth);
    const rowSpan = Math.ceil((contentHeight + rowGap) / (rowHeight + rowGap));
    tile.style.gridRowEnd = 'span ' + rowSpan;
  }

  function resizeAllGridItems() {
    tiles.forEach(resizeGridItem);
  }

  window.addEventListener('load', resizeAllGridItems);
  window.addEventListener('resize', () => {
    clearTimeout(window._resizeTimer);
    window._resizeTimer = setTimeout(resizeAllGridItems, 150);
  });

  // in case some images are cached and already "complete" before load fires
  tiles.forEach(tile => {
    const img = tile.querySelector('img');
    if (img.complete) resizeGridItem(tile);
    else img.addEventListener('load', () => resizeGridItem(tile));
  });
</script>
